<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Tense Flash Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            padding: 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .title {
            font-size: 2rem;
            font-weight: bold;
            color: white;
            margin-bottom: 0.5rem;
        }

        .progress {
            color: rgba(255, 255, 255, 0.8);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 0.75rem;
            padding: 1rem;
        }

        .font-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .font-btn {
            padding: 0.25rem 0.75rem;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .font-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .font-size {
            color: white;
            font-weight: 500;
        }

        .reset-btn {
            padding: 0.5rem 1rem;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .reset-btn:hover {
            background: #dc2626;
        }

        .card-nav {
            display: flex;
            justify-content: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .nav-btn {
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            font-size: 0.875rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            transform: scale(1.1);
        }

        .nav-btn.current {
            background: #fbbf24;
            color: black;
        }

        .nav-btn.studied {
            background: #10b981;
            color: white;
        }

        .nav-btn.unvisited {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .card-container {
            perspective: 1000px;
            margin-bottom: 1.5rem;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 400px;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.7s;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 0.75rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card-front {
            background: white;
        }

        .card-back {
            background: linear-gradient(135deg, #f0fdf4 0%, #dbeafe 100%);
            transform: rotateY(180deg);
            overflow-y: auto;
            justify-content: flex-start;
            align-items: stretch;
        }

        .front-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 1rem;
            text-align: center;
        }

        .front-subtitle {
            font-size: 1.125rem;
            color: #6b7280;
            font-style: italic;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .front-questions {
            text-align: left;
            color: #374151;
            font-weight: 500;
        }

        .front-questions div {
            margin-bottom: 0.75rem;
        }

        .flip-hint {
            position: absolute;
            bottom: 1rem;
            color: #9ca3af;
            font-size: 0.875rem;
        }

        .back-content h3 {
            font-size: 1.125rem;
            font-weight: bold;
            text-align: center;
            color: #059669;
            margin-bottom: 1rem;
        }

        .content-item {
            padding: 0.75rem;
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 1rem;
        }

        .content-type {
            font-weight: bold;
            color: #2563eb;
        }

        .content-note {
            font-weight: normal;
            color: #6b7280;
            margin-left: 0.25rem;
        }

        .content-example {
            color: #374151;
            font-style: italic;
            margin-top: 0.25rem;
        }

        .formula-section {
            border-top: 1px solid #e5e7eb;
            padding-top: 1rem;
            margin-top: 1rem;
        }

        .formula {
            font-weight: bold;
            color: #7c3aed;
        }

        .formula-text {
            margin-left: 0.5rem;
            font-family: monospace;
            background: #f3e8ff;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
        }

        .key-info {
            color: #ea580c;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .example-info {
            color: #059669;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-button {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .flip-button {
            padding: 0.75rem 2rem;
            background: #f59e0b;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .flip-button:hover {
            background: #d97706;
        }

        .trick-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 0.75rem;
        }

        .trick-emoji {
            font-size: 1.5rem;
        }

        .trick-form {
            font-weight: bold;
            color: #2563eb;
        }

        .trick-meaning {
            color: #6b7280;
        }

        .quick-check {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #fef3c7;
            border-radius: 0.5rem;
        }

        .quick-check-title {
            font-weight: 600;
            color: #92400e;
            margin-bottom: 0.5rem;
        }

        .quick-check-text {
            font-size: 0.875rem;
            color: #a16207;
        }

        .answer-item {
            padding: 0.75rem;
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 0.75rem;
        }

        .answer-text {
            font-weight: bold;
            color: #059669;
        }

        .answer-reason {
            color: #6b7280;
            margin-left: 0.5rem;
        }

        @media (max-width: 640px) {
            .title {
                font-size: 1.5rem;
            }
            
            .controls {
                flex-direction: column;
                gap: 1rem;
            }
            
            .flashcard {
                height: 350px;
            }
            
            .card-face {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Future Tense Flash Cards</h1>
            <div id="progress" class="progress">Card 1 of 6 • Studied: 0/6</div>
        </div>

        <div class="controls">
            <div class="font-controls">
                <button id="font-smaller" class="font-btn">A-</button>
                <span id="font-size" class="font-size">16px</span>
                <button id="font-larger" class="font-btn">A+</button>
            </div>
            <button id="reset-progress" class="reset-btn">Reset Progress</button>
        </div>

        <div id="card-nav" class="card-nav"></div>

        <div class="card-container">
            <div id="flashcard" class="flashcard">
                <div class="card-face card-front">
                    <div class="text-center">
                        <h2 id="front-title" class="front-title">WILL + Base Verb</h2>
                        <p id="front-subtitle" class="front-subtitle">When do I use this?</p>
                        <div id="front-questions" class="front-questions" style="display: none;"></div>
                    </div>
                    <div class="flip-hint">Click to flip</div>
                </div>

                <div class="card-face card-back">
                    <div id="back-content" class="back-content"></div>
                </div>
            </div>
        </div>

        <div class="navigation">
            <button id="prev-card" class="nav-button">← Previous</button>
            <button id="flip-card" class="flip-button">Show Answer</button>
            <button id="next-card" class="nav-button">Next →</button>
        </div>
    </div>

    <script>
        const flashCards = [
            {
                id: 1,
                title: "WILL + Base Verb",
                front: { title: "WILL + Base Verb", subtitle: "When do I use this?" },
                back: {
                    title: "3 Situations:",
                    content: [
                        { type: "PREDICTIONS", note: "(guessing)", example: "It will rain tomorrow" },
                        { type: "PROMISES", note: "(I promise you!)", example: "I will help you" },
                        { type: "SUDDEN DECISIONS", note: "(deciding right now)", example: "I'm hungry. I will eat" }
                    ],
                    formula: "WILL + VERB",
                    example: "I will call you later"
                }
            },
            {
                id: 2,
                title: "BE GOING TO + Base Verb",
                front: { title: "BE GOING TO + Base Verb", subtitle: "When do I use this?" },
                back: {
                    title: "2 Situations:",
                    content: [
                        { type: "PLANS", note: "(already decided)", example: "I am going to visit Paris" },
                        { type: "OBVIOUS PREDICTIONS", note: "(I can see it will happen)", example: "Look at those clouds! It is going to rain" }
                    ],
                    formula: "AM/IS/ARE + GOING TO + VERB",
                    example: "She is going to study tonight"
                }
            },
            {
                id: 3,
                title: "Present Continuous (Future)",
                front: { title: "AM/IS/ARE + VERB-ING (Future)", subtitle: "When do I use this?" },
                back: {
                    title: "1 Situation:",
                    content: [
                        { type: "DEFINITE ARRANGEMENTS", note: "(fixed appointment/plan)", example: "I am meeting John at 3pm" },
                        { type: "", note: "", example: "We are leaving at 8am" }
                    ],
                    formula: "AM/IS/ARE + VERB-ING",
                    key: "It's already arranged/booked/scheduled",
                    example: "I am seeing the doctor tomorrow"
                }
            },
            {
                id: 4,
                title: "Simple Present (Future)",
                front: { title: "Simple Present (Future)", subtitle: "When do I use this?" },
                back: {
                    title: "1 Situation:",
                    content: [
                        { type: "TIMETABLES & SCHEDULES", note: "(automatic/routine)", example: "The train leaves at 6pm" },
                        { type: "", note: "", example: "Class starts at 9am" }
                    ],
                    formula: "VERB (present form)",
                    key: "Same time every day/week",
                    example: "The movie begins at 8pm"
                }
            },
            {
                id: 5,
                title: "Quick Test",
                front: {
                    title: "Which future form?",
                    questions: [
                        '1. "I\'m thirsty. I _____ get water"',
                        '2. "The bus _____ at 3pm daily"', 
                        '3. "I _____ meeting him at 5pm"',
                        '4. "Look! She _____ fall!"'
                    ]
                },
                back: {
                    title: "ANSWERS:",
                    answers: [
                        { answer: "will", reason: "(sudden decision)" },
                        { answer: "arrives", reason: "(timetable)" },
                        { answer: "am", reason: "(arrangement)" },
                        { answer: "is going to", reason: "(obvious prediction)" }
                    ]
                }
            },
            {
                id: 6,
                title: "Memory Trick",
                front: { title: "Future Forms - Memory Trick" },
                back: {
                    tricks: [
                        { form: "WILL", meaning: "Uncertain/Spontaneous", emoji: "🤔" },
                        { form: "GOING TO", meaning: "Already Decided", emoji: "📋" },
                        { form: "Present Continuous", meaning: "In Calendar", emoji: "📅" },
                        { form: "Simple Present", meaning: "Robot Schedule", emoji: "🤖" }
                    ],
                    quickCheck: "If it's planned = GOING TO, If it's arranged = Present Continuous, If it's routine = Simple Present, If unsure = WILL"
                }
            }
        ];

        // State stored in memory since localStorage isn't available
        let state = {
            currentCard: 0,
            isFlipped: false,
            studiedCards: new Set(),
            fontSize: 16
        };

        const flashcard = document.getElementById('flashcard');
        const frontTitle = document.getElementById('front-title');
        const frontSubtitle = document.getElementById('front-subtitle');
        const frontQuestions = document.getElementById('front-questions');
        const backContent = document.getElementById('back-content');
        const progress = document.getElementById('progress');
        const fontSizeDisplay = document.getElementById('font-size');
        const flipButton = document.getElementById('flip-card');
        const cardNav = document.getElementById('card-nav');

        function updateDisplay() {
            const card = flashCards[state.currentCard];
            
            progress.textContent = `Card ${state.currentCard + 1} of ${flashCards.length} • Studied: ${state.studiedCards.size}/${flashCards.length}`;
            fontSizeDisplay.textContent = `${state.fontSize}px`;
            flashcard.style.fontSize = `${state.fontSize}px`;
            
            frontTitle.textContent = card.front.title;
            
            if (card.front.subtitle) {
                frontSubtitle.textContent = card.front.subtitle;
                frontSubtitle.style.display = 'block';
            } else {
                frontSubtitle.style.display = 'none';
            }
            
            if (card.front.questions) {
                frontQuestions.innerHTML = card.front.questions.map(q => `<div>${q}</div>`).join('');
                frontQuestions.style.display = 'block';
                frontSubtitle.style.display = 'none';
            } else {
                frontQuestions.style.display = 'none';
            }
            
            updateBackContent(card);
            updateNavigation();
            
            flipButton.textContent = state.isFlipped ? 'Flip Back' : 'Show Answer';
        }

        function updateBackContent(card) {
            let html = '';
            
            if (card.back.tricks) {
                html = `
                    <h3>Memory Tricks</h3>
                    <div class="space-y-3">
                        ${card.back.tricks.map(trick => `
                            <div class="trick-item">
                                <span class="trick-emoji">${trick.emoji}</span>
                                <div>
                                    <span class="trick-form">${trick.form}</span>
                                    <span class="trick-meaning"> = ${trick.meaning}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="quick-check">
                        <div class="quick-check-title">Quick Check:</div>
                        <div class="quick-check-text">${card.back.quickCheck}</div>
                    </div>
                `;
            } else if (card.back.answers) {
                html = `
                    <h3>${card.back.title}</h3>
                    ${card.back.answers.map((ans, i) => `
                        <div class="answer-item">
                            <span class="answer-text">${i + 1}. ${ans.answer}</span>
                            <span class="answer-reason">${ans.reason}</span>
                        </div>
                    `).join('')}
                `;
            } else {
                html = `
                    <h3>${card.back.title}</h3>
                    ${card.back.content.filter(item => item.type).map((item, i) => `
                        <div class="content-item">
                            <div class="content-type">
                                ${i + 1}. ${item.type} 
                                <span class="content-note">${item.note}</span>
                            </div>
                            <div class="content-example">"${item.example}"</div>
                        </div>
                    `).join('')}
                    <div class="formula-section">
                        <div class="formula">Formula: 
                            <span class="formula-text">${card.back.formula}</span>
                        </div>
                        ${card.back.key ? `<div class="key-info">Key: ${card.back.key}</div>` : ''}
                        <div class="example-info">
                            Example: <em>"${card.back.example}"</em>
                        </div>
                    </div>
                `;
            }
            
            backContent.innerHTML = html;
        }

        function updateNavigation() {
            cardNav.innerHTML = flashCards.map((card, index) => {
                let className = 'nav-btn ';
                if (index === state.currentCard) {
                    className += 'current';
                } else if (state.studiedCards.has(index)) {
                    className += 'studied';
                } else {
                    className += 'unvisited';
                }
                return `<button onclick="goToCard(${index})" class="${className}">${index + 1}</button>`;
            }).join('');
        }

        function flipCard() {
            state.isFlipped = !state.isFlipped;
            flashcard.classList.toggle('flipped', state.isFlipped);
            
            if (state.isFlipped) {
                state.studiedCards.add(state.currentCard);
            }
            
            updateDisplay();
        }

        function nextCard() {
            state.currentCard = (state.currentCard + 1) % flashCards.length;
            state.isFlipped = false;
            flashcard.classList.remove('flipped');
            updateDisplay();
        }

        function prevCard() {
            state.currentCard = (state.currentCard - 1 + flashCards.length) % flashCards.length;
            state.isFlipped = false;
            flashcard.classList.remove('flipped');
            updateDisplay();
        }

        function goToCard(index) {
            state.currentCard = index;
            state.isFlipped = false;
            flashcard.classList.remove('flipped');
            updateDisplay();
        }

        function resetProgress() {
            if (confirm('Reset all progress? This cannot be undone.')) {
                state.studiedCards = new Set();
                state.currentCard = 0;
                state.isFlipped = false;
                flashcard.classList.remove('flipped');
                updateDisplay();
            }
        }

        function changeFontSize(delta) {
            state.fontSize = Math.max(12, Math.min(24, state.fontSize + delta));
            updateDisplay();
        }

        // Event listeners
        document.getElementById('flip-card').addEventListener('click', flipCard);
        document.getElementById('next-card').addEventListener('click', nextCard);
        document.getElementById('prev-card').addEventListener('click', prevCard);
        document.getElementById('reset-progress').addEventListener('click', resetProgress);
        document.getElementById('font-smaller').addEventListener('click', () => changeFontSize(-2));
        document.getElementById('font-larger').addEventListener('click', () => changeFontSize(2));
        flashcard.addEventListener('click', flipCard);

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowLeft': 
                    e.preventDefault();
                    prevCard(); 
                    break;
                case 'ArrowRight': 
                    e.preventDefault();
                    nextCard(); 
                    break;
                case ' ': 
                    e.preventDefault(); 
                    flipCard(); 
                    break;
                case 'r':
                case 'R':
                    e.preventDefault();
                    resetProgress(); 
                    break;
            }
        });

        // Initialize when page loads
        window.addEventListener('load', updateDisplay);
    </script>
</body>
</html>
