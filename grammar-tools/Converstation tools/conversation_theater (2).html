<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation Theater</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .btn {
            background: #5a67d8;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(90, 103, 216, 0.3);
        }

        .btn:hover {
            background: #4c51bf;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(90, 103, 216, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .game-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .card-section h2 {
            color: #5a67d8;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
        }

        .card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 15px;
            padding: 20px;
            color: white;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card.grammar-card {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .card-content {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .grammar-rule {
            font-size: 0.95rem;
            opacity: 0.85;
            font-weight: 500;
            margin-bottom: 15px;
            padding: 8px 15px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .card-guide {
            font-size: 1rem;
            opacity: 0.95;
            border-top: 2px solid rgba(255,255,255,0.4);
            padding-top: 18px;
            text-align: left;
            line-height: 1.6;
        }

        .answer-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            margin-top: 30px;
        }

        .answer-section h2 {
            color: #5a67d8;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
        }

        .answer-section textarea {
            background: #f8fafc;
            border: 3px solid #e2e8f0;
            border-radius: 15px;
            padding: 20px;
            font-size: 1.1rem;
            line-height: 1.6;
            resize: vertical;
            min-height: 180px;
            font-family: inherit;
            transition: all 0.3s ease;
            width: 100%;
        }

        .answer-section textarea:focus {
            outline: none;
            border-color: #5a67d8;
            background: white;
            box-shadow: 0 0 0 4px rgba(90, 103, 216, 0.1);
        }

        .answer-stats {
            margin-top: 10px;
            text-align: right;
            color: #718096;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .game-area {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }

        .hidden {
            display: none;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 Conversation Theater</h1>
            <p>Draw your situation and grammar tools, then argue your case!</p>
        </div>

        <div class="controls">
            <button class="btn" onclick="drawNewCards()">🎲 Draw New Cards</button>
            <button class="btn" onclick="clearAnswer()">🗑️ Clear Text</button>
            <button class="btn" onclick="saveAnswer()">💾 Save Answer</button>
        </div>

        <div class="game-area">
            <div class="card-section">
                <h2>🎬 Your Situation</h2>
                <div class="card" id="situationCard">
                    <div class="card-content">Click "Draw New Cards" to start!</div>
                </div>
            </div>

            <div class="card-section">
                <h2>📝 Grammar Tools</h2>
                <div class="card grammar-card" id="grammarCard">
                    <div class="card-content">Your grammar challenge will appear here</div>
                </div>
            </div>
        </div>

        <div class="answer-section">
            <h2>✍️ Student's Answer</h2>
            <textarea 
                id="answerText" 
                placeholder="Write the student's response here..."
                rows="8"
            ></textarea>
            <div class="answer-stats">
                <span id="wordCount">0 words</span> • 
                <span id="charCount">0 characters</span>
            </div>
        </div>
    </div>

    <script>
        const situations = [
            "Your landlord wants to raise your rent by 30% because 'inflation, you know' 🏠💸",
            "Your boss scheduled a 3-hour meeting during your vacation to discuss 'work-life balance' 🏖️😤",
            "Your phone company charged you twice and says 'computer error' when you call 📱💳",
            "Your neighbor's dog barks opera at 3 AM every night (it's terrible opera) 🎭🐕",
            "The restaurant served you ice-cold pasta and the waiter says 'it's supposed to be that way' 🍝❄️",
            "Your flight was cancelled because the pilot 'didn't feel like flying today' ✈️😴",
            "Your internet cuts out every time you have a video call (but Netflix works perfectly) 💻📺",
            "Your car mechanic found 47 new problems that weren't there yesterday 🚗🔧",
            "Your doctor's office triple-booked your appointment and wants you to wait 3 hours 🏥⏰",
            "Your apartment's heating broke in winter and the landlord suggests 'wear more sweaters' 🥶🧥",
            "Your coworker steals your lunch AND your ideas (but the lunch theft hurts more) 🥪💡",
            "The store won't return your broken toaster because 'you probably broke it on purpose' 🍞⚡",
            "Your bank froze your account for 'suspicious activity' (buying groceries) 🏦🥕",
            "Your upstairs neighbor practices tap dancing in concrete boots at 6 AM 👠🥾",
            "Your child's teacher wants to discuss their 'creative interpretation' of math homework 📚➕",
            "Your insurance says your car accident claim is denied because 'cars are meant to crash' 🚗💥",
            "Your wedding venue wants to change your date because they found a 'better customer' 💒💰",
            "Your delivery driver left your expensive laptop on a park bench 'for safekeeping' 💻🪑",
            "Your gym charges you monthly fees even though it's been closed for 6 months 'for renovations' 💪🔒",
            "Your dentist wants to schedule 12 appointments for a simple cleaning (and sell you a $500 toothbrush) 🦷💰",
            "Your barber gave you a mohawk when you asked for 'just a tiny trim' ✂️🦔",
            "Your pizza arrived 3 hours late, stone cold, with extra pineapple (you specifically said NO pineapple) 🍕🍍",
            "Your Uber driver got lost using GPS and wants YOU to pay for the scenic route 🚗🗺️",
            "Your hotel room has no hot water, but the manager offers you 'a free mint' as compensation 🏨🍃"
        ];

        const grammarTools = [
            {
                tool: "Use 3 of these: should, could, must, might, can't",
                rule: "Modal Verbs",
                guide: "• The manager <strong>should</strong> understand my position<br>• We <strong>could</strong> reach a compromise here<br>• This <strong>might</strong> need escalation"
            },
            {
                tool: "Ask 4 different question types",
                rule: "Question Formation",
                guide: "• Yes/No: <strong>Are you listening to me?</strong><br>• How/Why: <strong>How would you feel?</strong><br>• Choice: <strong>Will you help me or not?</strong><br>• Tag: <strong>You understand, don't you?</strong>"
            },
            {
                tool: "Use both: had done, have done",
                rule: "Perfect Tenses",
                guide: "• I <strong>had expected</strong> better service than this<br>• We <strong>have discussed</strong> this issue before<br>• You <strong>have disappointed</strong> me completely"
            },
            {
                tool: "Use both: if, unless (show consequences)",
                rule: "Conditionals",
                guide: "• <strong>If</strong> we can't resolve this, I'll escalate<br>• <strong>Unless</strong> you help me now, this gets worse<br>• <strong>If</strong> I were you, I'd take this seriously"
            },
            {
                tool: "Use: better/worse, best/worst (compare)",
                rule: "Comparatives & Superlatives",
                guide: "• My experience was <strong>worse</strong> than expected<br>• This is the <strong>best</strong> solution for everyone<br>• Your service is <strong>better</strong> than your competitor"
            },
            {
                tool: "Use: was/were + past verb (avoid blame)",
                rule: "Passive Voice",
                guide: "• The agreement <strong>was broken</strong> somehow<br>• I <strong>was promised</strong> a different outcome<br>• These terms <strong>were never</strong> explained to me"
            },
            {
                tool: "Use: said/told/promised (mention what others said)",
                rule: "Reported Speech",
                guide: "• Your colleague <strong>told</strong> me this was possible<br>• The advertisement <strong>said</strong> something different<br>• Someone <strong>promised</strong> me a solution yesterday"
            },
            {
                tool: "Use both: will be + -ing, will have + past",
                rule: "Future Tenses",
                guide: "• I <strong>will be expecting</strong> your response soon<br>• By next week, this <strong>will have escalated</strong><br>• You <strong>will be hearing</strong> from my lawyer"
            }
        ];

        const gameData = JSON.parse(localStorage.getItem('conversationTheater')) || {
            cardsDrawn: 0,
            savedAnswers: []
        };

        function saveData() {
            localStorage.setItem('conversationTheater', JSON.stringify(gameData));
        }

        function drawNewCards() {
            const situationCard = document.getElementById('situationCard');
            const grammarCard = document.getElementById('grammarCard');

            // Random selections
            const situation = situations[Math.floor(Math.random() * situations.length)];
            const grammar = grammarTools[Math.floor(Math.random() * grammarTools.length)];

            // Update cards with animation
            situationCard.style.opacity = '0';
            grammarCard.style.opacity = '0';

            setTimeout(() => {
                situationCard.innerHTML = `<div class="card-content">${situation}</div>`;
                grammarCard.innerHTML = `
                    <div class="card-content">${grammar.tool}</div>
                    <div class="grammar-rule">📝 ${grammar.rule}</div>
                    <div class="card-guide">
                        ${grammar.guide}
                    </div>
                `;

                situationCard.style.opacity = '1';
                grammarCard.style.opacity = '1';
                situationCard.classList.add('fade-in');
                grammarCard.classList.add('fade-in');

                // Update stats
                gameData.cardsDrawn++;
                saveData();

                // Clear previous answer
                document.getElementById('answerText').value = '';
                updateWordCount();
            }, 300);
        }

        function clearAnswer() {
            document.getElementById('answerText').value = '';
            updateWordCount();
        }

        function saveAnswer() {
            const answerText = document.getElementById('answerText').value.trim();
            if (!answerText) {
                alert('Please write an answer first!');
                return;
            }

            const answer = {
                timestamp: new Date().toLocaleString(),
                situation: document.querySelector('#situationCard .card-content').textContent,
                grammar: document.querySelector('#grammarCard .card-content').textContent,
                answer: answerText
            };

            gameData.savedAnswers.push(answer);
            saveData();
            
            alert('✅ Answer saved! You can review it later.');
        }

        function updateWordCount() {
            const text = document.getElementById('answerText').value;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const chars = text.length;
            
            document.getElementById('wordCount').textContent = `${words} words`;
            document.getElementById('charCount').textContent = `${chars} characters`;
        }

        // Initialize word count
        document.getElementById('answerText').addEventListener('input', updateWordCount);
        updateWordCount();

        // Auto-save every 30 seconds
        setInterval(saveData, 30000);
    </script>
</body>
</html>
