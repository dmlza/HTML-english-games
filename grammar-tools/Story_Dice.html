<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Simple Story Dice</title>
        <style>
            body {
                font-family: "Comic Sans MS", cursive, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                margin: 0;
                padding: 20px;
                color: white;
            }

            .container {
                max-width: 800px;
                margin: 0 auto;
                text-align: center;
            }

            .title {
                font-size: 3em;
                margin-bottom: 30px;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            }

            .dice-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                gap: 20px;
                margin-bottom: 30px;
            }

            .dice-box {
                background: rgba(255, 255, 255, 0.9);
                border-radius: 20px;
                padding: 20px;
                color: #333;
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
                transition: transform 0.2s ease;
            }

            .dice-box:hover {
                transform: translateY(-5px);
            }

            .dice-title {
                font-size: 1.5em;
                font-weight: bold;
                margin-bottom: 15px;
                color: #5a67d8;
            }

            .dice {
                width: 80px;
                height: 80px;
                background: linear-gradient(45deg, #667eea, #764ba2);
                border-radius: 15px;
                margin: 0 auto 15px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 2em;
                cursor: pointer;
                color: white;
                transition: all 0.3s ease;
            }

            .dice:hover {
                transform: rotate(10deg) scale(1.1);
            }

            .dice.rolling {
                animation: spin 0.8s ease-out;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(720deg);
                }
            }

            .result {
                font-size: 1.2em;
                min-height: 60px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: bold;
                background: rgba(90, 103, 216, 0.1);
                border-radius: 10px;
                padding: 10px;
                margin-top: 10px;
            }

            .emoji-result {
                font-size: 3em;
            }

            .roll-all {
                background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
                border: none;
                border-radius: 50px;
                padding: 15px 30px;
                font-size: 1.3em;
                color: white;
                cursor: pointer;
                margin: 20px;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
                transition: transform 0.2s ease;
            }

            .roll-all:hover {
                transform: translateY(-3px);
            }

            .placeholder {
                color: #888;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1 class="title">🎲 Story Dice</h1>

            <div class="dice-grid">
                <div class="dice-box">
                    <div class="dice-title">THING SUBJECT</div>
                    <div class="dice" onclick="rollDice('character')">🎲</div>
                    <div class="result emoji-result" id="character-result">
                        <span class="placeholder">Click to roll!</span>
                    </div>
                </div>

                <div class="dice-box">
                    <div class="dice-title">Place</div>
                    <div class="dice" onclick="rollDice('place')">🎲</div>
                    <div class="result emoji-result" id="place-result">
                        <span class="placeholder">Click to roll!</span>
                    </div>
                </div>

                <div class="dice-box">
                    <div class="dice-title">Action</div>
                    <div class="dice" onclick="rollDice('action')">🎲</div>
                    <div class="result" id="action-result">
                        <span class="placeholder">Click to roll!</span>
                    </div>
                </div>

                <div class="dice-box">
                    <div class="dice-title">Plot Twist</div>
                    <div class="dice" onclick="rollDice('plottwist')">🎲</div>
                    <div class="result" id="plottwist-result">
                        <span class="placeholder">Click to roll!</span>
                    </div>
                </div>
            </div>

            <button class="roll-all" onclick="rollAllDice()">
                🎲 Roll All Dice!
            </button>
        </div>

        <script>
            const storyElements = {
                character: [
                    "👩‍💼",
                    "👨‍🍳",
                    "👵",
                    "👨‍🏫",
                    "👩‍⚕️",
                    "👨‍💻",
                    "👩‍🎨",
                    "👨‍🔧",
                    "👩‍🚒",
                    "👨‍⚖️",
                    "👩‍🌾",
                    "👨‍🎤",
                    "👩‍✈️",
                    "👨‍🍳",
                    "👩‍🔬",
                    "👨‍📚",
                ],

                place: [
                    "🏢",
                    "🏠",
                    "🍕",
                    "🏥",
                    "🚗",
                    "✈️",
                    "🏖️",
                    "🏔️",
                    "🎪",
                    "🎬",
                    "🚂",
                    "🏪",
                    "🎡",
                    "🏰",
                    "🚢",
                    "🌙",
                ],

                action: [
                    "needs to share the TV remote",
                    "wants to order different pizza toppings",
                    "has to plan a surprise party",
                    "must choose a vacation destination",
                    "needs to divide household chores",
                    "wants to convince someone to exercise",
                    "has to organize a work meeting",
                    "needs to plan dinner for picky eaters",
                    "must coordinate a group project",
                    "wants to negotiate bedtime",
                    "has to split the restaurant bill",
                    "needs to choose a movie everyone likes",
                ],

                plottwist: [
                    "The wifi suddenly stops working!",
                    "It starts raining cats and dogs!",
                    "Someone famous walks in!",
                    "The power goes out!",
                    "A long-lost friend appears!",
                    "The main character loses their voice!",
                    "Everyone's phone batteries die!",
                    "A surprise visitor arrives!",
                    "The elevator gets stuck!",
                    "Someone wins the lottery!",
                    "The main character's ex shows up!",
                    "A food delivery goes to the wrong place!",
                ],
            };

            function rollDice(category) {
                const dice = event.target;
                const resultDiv = document.getElementById(category + "-result");

                // Add rolling animation
                dice.classList.add("rolling");

                // Random rolling effect
                let rollCount = 0;
                const rollInterval = setInterval(() => {
                    const randomItem =
                        storyElements[category][
                            Math.floor(
                                Math.random() * storyElements[category].length,
                            )
                        ];
                    resultDiv.textContent = randomItem;
                    rollCount++;

                    if (rollCount > 6) {
                        clearInterval(rollInterval);
                        dice.classList.remove("rolling");

                        // Final result
                        const finalItem =
                            storyElements[category][
                                Math.floor(
                                    Math.random() *
                                        storyElements[category].length,
                                )
                            ];
                        resultDiv.textContent = finalItem;
                    }
                }, 100);
            }

            function rollAllDice() {
                const categories = [
                    "character",
                    "place",
                    "action",
                    "plottwist",
                ];
                categories.forEach((category, index) => {
                    setTimeout(() => {
                        const dice = document.querySelector(
                            `#${category}-result`,
                        ).previousElementSibling;
                        dice.click();
                    }, index * 200);
                });
            }
        </script>
    </body>
</html>
